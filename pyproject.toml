    "django-filter>=25.2",
    "django-jalali-date>=2.0.0",
    "django-redis>=7.0.0",
    "djangorestframework>=3.17.1",
    "django-debug-toolbar>=4.0",
    "mysqlclient>=2.2.8",
    "packaging>=26.2",
    "pillow>=12.2.0",
